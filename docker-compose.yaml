services:
  # MQTT Broker: The central message hub for the IoT pipeline.
  mosquitto:
    image: eclipse-mosquitto:latest
    container_name: mosquitto
    ports:
      - "1883:1883" # Standard MQTT port
      - "9001:9001" # MQTT over WebSockets
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/log:/mosquitto/log
      - mosquitto-storage:/mosquitto/data
    healthcheck:
      # Use mosquitto_sub to verify the broker is responsive
      test:
        [
          "CMD",
          "mosquitto_sub",
          "-t",
          "$$SYS/#",
          "-C",
          "1",
          "-i",
          "healthcheck",
          "-W",
          "3",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # cAdvisor: Collects resource usage and performance characteristics from running containers.
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: monitoring_cadvisor
    restart: unless-stopped
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    expose:
      - 8080

  # Node Exporter: Exports hardware and OS metrics from the host machine.
  node-exporter:
    image: prom/node-exporter:latest
    container_name: monitoring_node_exporter
    restart: unless-stopped
    expose:
      - 9100

  # Prometheus: Time-series database that scrapes and stores metrics from cAdvisor and Node Exporter.
  prometheus:
    image: prom/prometheus:latest
    container_name: monitoring_prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus/config:/etc/prometheus/
      - prometheus-storage:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    expose:
      - 9090
    ports:
      - "9090:9090"

  # Grafana: Data visualization tool for creating dashboards based on Prometheus metrics.
  grafana:
    image: grafana/grafana:latest
    container_name: monitoring_grafana
    restart: unless-stopped
    expose:
      - 3000
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./grafana/provisioning/:/etc/grafana/provisioning
      - ./grafana/example/:/var/lib/grafana/dashboards
      - grafana-storage:/var/lib/grafana

  # TimescaleDB: a pgsql extension for speeding up timeseries data
  timescaledb:
    image: timescale/timescaledb-ha:pg18.1-ts2.25.1
    container_name: timescaledb
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: epu
    volumes:
      - timescaledb-storage:/var/lib/postgresql/data
      - ./timescaledb/init/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  # Service Publisher: Simulates IoT devices sending data. Can be scaled using --scale publisher=N.
  publisher:
    build: ./service_publisher
    restart: unless-stopped
    depends_on:
      mosquitto:
        condition: service_healthy
      timescaledb:
        condition: service_healthy

  # Service Subscriber: Consumes and processes sensor data.
  subscriber:
    build: ./service_subscriber
    container_name: subscriber
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      DB_BACKEND:      ${DB_BACKEND:-timescaledb}
      DB_HOST:         ${DB_HOST:-timescaledb}
      DB_USER:         ${DB_USER:-postgres}
      DB_PASSWORD:     ${DB_PASSWORD:-postgres}
      DB_NAME:         ${DB_NAME:-epu}
      DB_POOL_SIZE:    ${DB_POOL_SIZE:-20}
      BATCH_ENABLED:   ${BATCH_ENABLED:-false}
      BATCH_SIZE:      ${BATCH_SIZE:-100}
      BATCH_TIMEOUT_MS: ${BATCH_TIMEOUT_MS:-1000}
    depends_on:
      mosquitto:
        condition: service_healthy
      timescaledb:
        condition: service_healthy

volumes:
  mosquitto-storage: {}
  prometheus-storage: {}
  grafana-storage: {}
  timescaledb-storage: {}
